<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة إدارة المسوقين - Glamour Beauty</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}
.card{background:#161616;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:20px;width:100%;max-width:480px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
h2{font-size:18px;margin-bottom:15px;text-align:center;color:#00d9ff}
h3{font-size:15px;color:#00d9ff;margin-bottom:10px}
.group{margin-bottom:12px}
label{display:block;font-size:12px;color:#bbb;margin-bottom:4px}
input,select{width:100%;padding:10px;border-radius:8px;background:#222;border:1px solid #333;color:#fff;font-size:14px}
input:focus,select:focus{outline:none;border-color:#00d9ff}
.btn{width:100%;padding:11px;border-radius:8px;background:linear-gradient(135deg,#20d879,#0fae62);color:#fff;font-size:15px;font-weight:700;border:none;cursor:pointer;margin-top:8px}
.btn:active{transform:scale(0.98)}
.btn-danger{background:#e74c3c;margin-top:5px}
.btn-test{background:#3498db;margin-top:5px}
.copy-box{background:#111;padding:8px;border-radius:6px;font-size:11px;direction:ltr;text-align:left;color:#48e0a4;word-break:break-all;margin-top:6px;cursor:pointer}
.login-box{display:block}
.panel-box{display:none}
hr{border:0;border-top:1px solid #222;margin:15px 0}
.section-box{background:#1a1a1a;padding:12px;border-radius:10px;margin-bottom:12px;border:1px solid #262626}
</style>
</head>
<body>

<div class="card">
    
    <!-- قسم تسجيل الدخول -->
    <div id="loginBox" class="login-box">
        <h2>تسجيل الدخول للأداة</h2>
        <div class="group">
            <label>كلمة المرور</label>
            <input type="password" id="adminPass" placeholder="أدخل كلمة المرور" style="direction:ltr;text-align:left">
        </div>
        <button class="btn" onclick="checkLogin()">دخول</button>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="panelBox" class="panel-box">
        <h2>لوحة التحكم المركزية للمسوقين</h2>
        
        <!-- رقم الطوارئ الأساسي -->
        <div class="section-box">
            <div class="group" style="margin-bottom:0">
                <label>رقم المتجر الأساسي (خط الطوارئ عند الحظر)</label>
                <input type="text" id="dfPhone" placeholder="972567938099" style="direction:ltr;text-align:left">
            </div>
        </div>

        <!-- إضافة أو تحديث مسوق -->
        <div class="section-box">
            <h3>➕ إضافة أو تحديث مسوق</h3>
            <div class="group">
                <label>اسم المسوق</label>
                <input type="text" id="mName" placeholder="مثال: أسماء">
            </div>
            <div class="group">
                <label>رقم واتساب المسوق (مع مفتاح الدولة بدون +)</label>
                <input type="text" id="mPhone" placeholder="مثال: 972567845326" style="direction:ltr;text-align:left">
            </div>
            <div class="group">
                <label>اختصار اسمه (في رابط الإعلان مثل: as)</label>
                <input type="text" id="mKey" placeholder="مثال: as" style="direction:ltr;text-align:left">
            </div>
            <button class="btn" onclick="addOrUpdateAffiliate()">حفظ وتوليد الرابط</button>
        </div>

        <!-- القائمة المنسدلة النظيفة -->
        <div class="section-box">
            <h3>📋 قائمة المسوقين</h3>
            <div class="group">
                <label>اختر مسوقاً لإدارة رابطه أو فحصه:</label>
                <select id="affSelect" onchange="onAffiliateSelect()">
                    <option value="">-- اختر مسوقاً --</option>
                </select>
            </div>
            
            <div id="selectedAffDetails" style="display:none;background:#111;padding:10px;border-radius:8px;margin-top:10px;border:1px solid #333">
                <label style="color:#00d9ff;margin-bottom:2px">الرابط المولد:</label>
                <div id="selectedLinkBox" class="copy-box" onclick="copySelectedLink()" title="اضغط للنسخ"></div>
                
                <button class="btn btn-test" onclick="testSelectedLink()">🔍 فحص واختبار الرابط (تجربة الواتساب)</button>
                <button class="btn btn-danger" onclick="deleteSelectedAffiliate()">🗑️ حذف هذا المسوق</button>
            </div>
        </div>

        <hr>

        <!-- تصدير التحديث -->
        <div class="section-box" style="border-color:#3b32a8">
            <button class="btn" style="background:#6c5ce7;margin-top:0" onclick="exportJsonFile()">نسخ كود التحديث لملف config.json</button>
            <div id="outputArea" style="margin-top:10px"></div>
        </div>

    </div>
</div>

<script>
const CORRECT_PASS = "admin123";
let currentConfig = { defaultPhone: "972567938099", affiliates: {} };

function checkLogin() {
    if (document.getElementById('adminPass').value === CORRECT_PASS) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('panelBox').style.display = 'block';
        loadConfig();
    } else {
        alert('كلمة المرور خاطئة!');
    }
}

function loadConfig() {
    fetch('config.json?t=' + Date.now())
    .then(res => res.json())
    .then(data => {
        currentConfig = data;
        document.getElementById('dfPhone').value = currentConfig.defaultPhone || "972567938099";
        renderSelectDropdown();
    })
    .catch(err => {
        renderSelectDropdown();
    });
}

// القائمة أصبحت تعرض الاسم فقط بشكل مرتب وخالٍ من الزحمة
function renderSelectDropdown() {
    const select = document.getElementById('affSelect');
    select.innerHTML = '<option value="">-- اختر مسوقاً --</option>';
    document.getElementById('selectedAffDetails').style.display = 'none';

    if (!currentConfig.affiliates) currentConfig.affiliates = {};

    for (let key in currentConfig.affiliates) {
        const aff = currentConfig.affiliates[key];
        const name = (typeof aff === 'object' && aff.name) ? aff.name : key;
        
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = name; // عرض الاسم فقط بكل نظافة وسلاسة
        select.appendChild(opt);
    }
}

function onAffiliateSelect() {
    const key = document.getElementById('affSelect').value;
    const detailsDiv = document.getElementById('selectedAffDetails');
    
    if (!key) {
        detailsDiv.style.display = 'none';
        return;
    }

    const aff = currentConfig.affiliates[key];
    const phone = typeof aff === 'object' ? aff.phone : aff;
    const name = (typeof aff === 'object' && aff.name) ? aff.name : "";

    document.getElementById('mKey').value = key;
    document.getElementById('mPhone').value = phone;
    document.getElementById('mName').value = name;

    const fullLink = "https://glamourbeauty.online/?ref=" + key;
    document.getElementById('selectedLinkBox').innerHTML = `🔗 ${fullLink}`;
    detailsDiv.style.display = 'block';
}

function copySelectedLink() {
    const key = document.getElementById('affSelect').value;
    if(!key) return;
    const fullLink = "https://glamourbeauty.online/?ref=" + key;
    navigator.clipboard.writeText(fullLink);
    alert('تم نسخ الرابط بنجاح!');
}

function testSelectedLink() {
    const key = document.getElementById('affSelect').value;
    if (!key) return;
    
    const aff = currentConfig.affiliates[key];
    const phone = typeof aff === 'object' ? aff.phone : aff;
    const cleanPhone = phone.replace(/[^0-9]/g, '');
    
    const testUrl = `https://wa.me/${cleanPhone}?text=` + encodeURIComponent(`مرحباً، هذا فحص تجريبي للرابط الخاص بالمسوق: ${key}`);
    window.open(testUrl, '_blank');
}

function addOrUpdateAffiliate() {
    const name = document.getElementById('mName').value.trim();
    const phone = document.getElementById('mPhone').value.trim();
    const key = document.getElementById('mKey').value.trim().toLowerCase();

    if (!phone || !key) {
        alert('يرجى إدخال رقم الواتساب واختصار الاسم على الأقل!');
        return;
    }

    currentConfig.affiliates[key] = {
        phone: phone,
        name: name || key
    };

    renderSelectDropdown();
    
    document.getElementById('mName').value = '';
    document.getElementById('mPhone').value = '';
    document.getElementById('mKey').value = '';
    
    alert('تم حفظ المسوق بنجاح! لا تنسَ نسخ كود التحديث بالأسفل ولصقه في config.json.');
}

function deleteSelectedAffiliate() {
    const key = document.getElementById('affSelect').value;
    if (!key) return;

    if (confirm(`هل أنت متأكد من حذف المسوق (${key})؟`)) {
        delete currentConfig.affiliates[key];
        renderSelectDropdown();
        alert('تم الحذف بنجاح. تذكر نسخ كود التحديث في الأسفل وحفظه في ملف config.json.');
    }
}

function exportJsonFile() {
    currentConfig.defaultPhone = document.getElementById('dfPhone').value.trim();
    const jsonString = JSON.stringify(currentConfig, null, 2);
    
    document.getElementById('outputArea').innerHTML = `
        <label style="color:#00d9ff;margin-bottom:4px">انسخ هذا المحتوى بالكامل ولصقه داخل ملف config.json:</label>
        <textarea style="width:100%;height:130px;background:#111;color:#48e0a4;padding:8px;font-size:12px;direction:ltr;border:1px solid #333;border-radius:6px" readonly>${jsonString}</textarea>
    `;
}
</script>
</body>
</html>
