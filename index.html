        .whatsapp-circle-btn {

            justify-content: center;
            width: 120px;
            height: 120px;

            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

        .whatsapp-circle-btn:hover {

            box-shadow: 0 20px 40px rgba(37, 211, 102, 0.4);
        }
        .whatsapp-circle-btn:active {
            transform: scale(0.92);

        .whatsapp-bottom-bar {
            background-color: #25d366;
            color: #ffffff;
            padding: 18px 25px;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 90%;
            max-width: 400px;
            margin: 0 auto 30px auto;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(37, 211, 102, 0.25);
            transition: all 0.2s ease;
        }
        .whatsapp-bottom-bar:active {
            transform: scale(0.97);
            background-color: #128c7e; /* انعكاس لوني احترافي عند الضغط */
        }
        .whatsapp-bottom-bar svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }

        /* --- تنسيقات الأزرار العائمة على اليمين --- */
        .glamour-social-widget {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 99999;
            font-family: 'Tajawal', sans-serif;
        }
        .glamour-main-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            border: none;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 117, 140, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);

        }
        .glamour-social-widget .icon-close { display: none; }
        .glamour-social-widget.active .icon-open { display: none; }
        .glamour-social-widget.active .icon-close { display: block; }
        .social-menu {
            display: flex;
            flex-direction: column-reverse;

            margin-bottom: 15px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);

        .glamour-social-widget.active .social-menu {

            visibility: visible;
            transform: translateY(0);

        .social-btn {

        });
        document.addEventListener('click', function(event) {
            const widget = document.querySelector('.glamour-social-widget');
            if (!widget.contains(event.target)) {
                widget.classList.remove('active');
            }
        });
    </script>
</body>
</html>
