            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

        .whatsapp-circle-btn:hover {

            box-shadow: 0 20px 40px rgba(37, 211, 102, 0.4);
        }
        .whatsapp-circle-btn svg {
            width: 65px;
            height: 65px;
            fill: #ffffff;
        }
        .action-label {

            font-weight: 900;
            color: #ffffff;
            margin-bottom: 8px;
        }
        .action-sub {
            font-size: 14px;
            color: #aaaaaa;
            font-weight: 500;
            margin-bottom: 35px;
        }
        .welcome-text {

            left: 0;
            width: 100%;

            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            padding: 12px 15px;
            z-index: 1000;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.8);

            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #25d366, #128c7e);

            padding: 12px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;

            height: 22px;
            fill: #ffffff;
