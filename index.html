  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background: #0f1115; /* خلفية سوداء داكنة وفخمة مريحة للعين */
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .box {
      background: #181b22; /* صندوق كحلي داكن وأنيق للمحتوى */
      padding: 45px 30px;
      border-radius: 16px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .icon-container {
      font-size: 50px;
      margin-bottom: 15px;
    }
    h1 {
      color: #ffffff;
      margin-bottom: 15px;
      font-size: 24px;
      font-weight: 700;
    }
    p {
      color: #9ba1a6;
      line-height: 1.7;
      font-size: 15px;
      margin-bottom: 25px;
    }
    .btn {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #25D366, #1EBE5D); /* تدرج أخضر واتسابي رائع */
      color: #fff;
      padding: 16px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      font-size: 17px;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn:hover {
      background: linear-gradient(135deg, #1EBE5D, #189e4c);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
    }
    .btn:active {
      transform: scale(0.98);
    }
    .secure-note {
      margin-top: 20px;
      font-size: 13px;
      color: #6c757d;
    }
  </style>
</head>
<body>

  <div class="box">
    <div class="icon-container">🛍️</div>
    <h1>أهلاً بك في متجرنا الرقمي</h1>
    <p>انقر على الزر أدناه للتواصل المباشر مع فريق المبيعات عبر الواتساب والحصول على العرض الحصري الخاص بك فوراً.</p>
    
    <a id="whatsappButton" href="#" class="btn" onclick="redirectToWa(event)">
      💬 اضغط هنا للتواصل عبر واتساب
    </a>

    <div class="secure-note">🔒 تواصل آمن وسريع عبر تطبيق واتساب</div>
  </div>

  <script>
    /* جدول المسوقين: الرمز المختصر + أرقام هواتفهم */
    const marketers = {
      "as": "972567845326",   // أسماء (asmaa)
      "so": "970567031881",   // سوما (soma)
      "de": "972567341418"    // ضياء (deyaa)
    };

    /* الرقم الافتراضي عند الدخول دون رابط مسوق */
    const defaultPhone = "972567938099";

    /* قراءة رمز المسوق من الرابط (مثال: ?ref=as) */
    const urlParams = new URLSearchParams(window.location.search);
    const requestedMarketerCode = (urlParams.get("ref") || "").trim().toLowerCase();

    /* اعتماد الرمز إذا كان موجوداً، وإلا يتم توجيهه للرقم الافتراضي (direct) */
    const activeMarketerCode = Object.prototype.hasOwnProperty.call(marketers, requestedMarketerCode)
      ? requestedMarketerCode
      : "direct";

    /* تحديد رقم واتساب المستهدف بناءً على المسوق أو الافتراضي */
    const targetPhone = activeMarketerCode === "direct"
      ? defaultPhone
      : marketers[activeMarketerCode];

    /* إنشاء رسالة واتساب مع إظهار كود المسوق إن وجد */
    const displayCode = activeMarketerCode === "direct" ? "" : ` (${activeMarketerCode})`;
    const rawMessage = `مرحبًا، شاهدت إعلانكم على TikTok وأود معرفة المزيد.${displayCode}`;
    const finalWhatsAppUrl = `https://wa.me/${targetPhone}?text=${encodeURIComponent(rawMessage)}`;

    /* ربط الرابط بالزر */
    const btnElem = document.getElementById("whatsappButton");
    if (btnElem) {
      btnElem.href = finalWhatsAppUrl;
    }

    let eventTracked = false;

    /* دالة النقر اليدوي: تسجيل التحويلة عند الضغط فقط مع تأخير 300ms لضمان وصولها للسيرفر */
    function redirectToWa(e) {
      e.preventDefault();
      if (!eventTracked && typeof ttq !== 'undefined') {
        ttq.track('InitiateCheckout');
        eventTracked = true;
      }
      setTimeout(function() {
        window.location.assign(finalWhatsAppUrl);
      }, 300);
    }
  </script>

</body>
</html>
