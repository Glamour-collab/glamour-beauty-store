    <!-- نهاية كود البكسل -->

    <style>
        :root {
            --primary-color: #111827;
            --whatsapp-color: #25d366; /* لون واتساب الشهير */
            --whatsapp-hover: #1ebd5d;
            --bg-color: #0b0f19; /* خلفية فاخرة داكنة */
            --text-color: #9ca3af;
            --card-bg: #1f2937; /* لون بطاقة فاخر وراقي */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
            color: #ffffff;
            text-align: center;
            padding: 3rem 1rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid #374151;
        }

        header h1 {
            font-size: 2.4rem;
            margin-bottom: 0.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            direction: ltr;
            color: #f3f4f6;
        }

        header p {
            font-size: 1.05rem;
            color: #9ca3af;
            max-width: 600px;
            margin: 0 auto;
        }

        main {
            flex: 1;
            max-width: 700px;
            width: 100%;
            margin: 2.5rem auto;
            padding: 0 1rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 2.5rem 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 1.5rem;
            text-align: center;
            border: 1px solid #374151;
        }

        .card h2 {
            font-size: 1.6rem;
            color: #f3f4f6;
            margin-bottom: 0.75rem;
            font-weight: 700;
        }

        .card p {
            margin-bottom: 2rem;
            color: #9ca3af;
            font-size: 1.05rem;
        }

        /* تنسيق زر واتساب الاحترافي */
        .whatsapp-cta-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: var(--whatsapp-color);
            color: #ffffff;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 700;
            padding: 1.1rem 2rem;
            border-radius: 50px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.35);
            transition: all 0.25s ease-in-out;
            cursor: pointer;
        }

        .whatsapp-cta-btn:hover {
            background-color: var(--whatsapp-hover);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.5);
        }

        .whatsapp-cta-btn svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
            flex-shrink: 0;
        }

        footer {
            background-color: #111827;
            color: #6b7280;
            text-align: center;
            padding: 2rem 1rem;
            font-size: 0.9rem;
            margin-top: auto;
            border-top: 1px solid #374151;
        }

        footer p {
            margin-bottom: 1.25rem;
        }
    </style>
