    <h1>أهلاً بكم في متجرنا Glamour Beauty</h1>
    <p>نحن نقدم أفضل المنتجات والخدمات المميزة لعملائنا. تصفح عروضنا الحصرية وتواصل معنا عبر الواتساب لمعرفة المزيد.</p>

    <!-- زر الواتساب -->
    <a id="whatsappButton" href="#" class="whatsapp-btn" onclick="redirectToWa(event)">
      <svg class="whatsapp-icon" viewBox="0 0 24 24">
        <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>

      تواصل عبر واتساب
    </a>

    <div class="secure-note">🔒 تواصل آمن وسريع عبر تطبيق واتساب</div>
  </div>

  <script>
    /* التقاط وحفظ معرف نقرة تيك توك (ttclid) لضمان دقة ربط الإعلانات */
    const urlParamsSearch = new URLSearchParams(window.location.search);
    const ttclid = urlParamsSearch.get('ttclid');
    if (ttclid) {
      localStorage.setItem('tt_click_id', ttclid);
    }

    /* جدول المسوقين: الرمز المختصر + أرقام هواتفهم */
    const marketers = {
      "as": "972567845326",   // أسماء (asmaa)
      "so": "970567031881",   // سوما (soma)
      "de": "972567341418"    // ضياء (deyaa)
    };

    /* الرقم الافتراضي عند الدخول دون رابط مسوق */
    const defaultPhone = "972567938099";

    /* قراءة رمز المسوق من الرابط */
    const requestedMarketerCode = (urlParamsSearch.get("ref") || "").trim().toLowerCase();

    /* اعتماد الرمز الصحيح */
    const activeMarketerCode = Object.prototype.hasOwnProperty.call(marketers, requestedMarketerCode)
      ? requestedMarketerCode
      : "direct";

    /* تحديد رقم واتساب المستهدف */
    const targetPhone = activeMarketerCode === "direct"
      ? defaultPhone
      : marketers[activeMarketerCode];

    /* إنشاء رسالة واتساب مع إظهار كود المسوق إن وجد */
    const displayCode = activeMarketerCode === "direct" ? "" : ` (${activeMarketerCode})`;
    const rawMessage = `مرحبًا، شاهدت إعلانكم على TikTok وأود معرفة المزيد.${displayCode}`;
    const finalWhatsAppUrl = `https://wa.me/${targetPhone}?text=${encodeURIComponent(rawMessage)}`;

    /* ربط الرابط بالزر */
    const btnElem = document.getElementById("whatsappButton");
    if (btnElem) {
      btnElem.href = finalWhatsAppUrl;
    }

    let eventTracked = false;

    /* تسجيل الأحداث مع فلترة الروبوتات وتوليد معرف فريد (event_id) لرفع جودة بيانات البيكسل */
    function redirectToWa(e) {
      e.preventDefault();

      if (!eventTracked) {
        eventTracked = true;

        /* فحص ما إذا كان الزائر بشراً حقيقياً وليست روبوتات فحص الإعلانات */
        const isBot = /bot|crawl|spider|bytespider|headless/i.test(navigator.userAgent);

        if (!isBot && typeof ttq !== 'undefined') {
          /* توليد معرف فريد للحدث لمنع التكرار ورفع كفاءة الخوارزمية */
          const uniqueEventId = 'evt_' + Date.now + '_' + Math.random().toString(36).substring(2, 9);

          /* إرسال حدث بدء الشراء بالمعايير الاحترافية */
          ttq.track('InitiateCheckout', {
            event_id: uniqueEventId,
            contents: [
              {
                content_id: 'glamour_beauty_product',
                content_type: 'product',
                quantity: 1
              }
            ],
            value: 1,
            currency: 'USD'
          });

          /* إرسال حدث تتبع التواصل */
          ttq.track('Contact', {
            event_id: 'con_' + uniqueEventId
          });
        }
      }

      /* التحويل إلى واتساب بعد إرسال إشارات البيكسل بأمان */
      setTimeout(function() {
        window.location.assign(finalWhatsAppUrl);
      }, 400);
    }
  </script>
